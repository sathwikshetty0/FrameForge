<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Frame/image border -->
  <rect x="3" y="5" width="26" height="22" rx="2" stroke="#4F46E5" stroke-width="2" fill="#1E1B4B"/>
  <!-- Magnifying glass circle -->
  <circle cx="18" cy="16" r="6" stroke="#A5B4FC" stroke-width="2" fill="none"/>
  <!-- Magnifying glass handle -->
  <line x1="22.5" y1="20.5" x2="27" y2="25" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkmark inside lens -->
  <polyline points="15,16.5 17,18.5 21,14" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
